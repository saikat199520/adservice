name: Build Push Image Trigger CI

on:
  push:
    branches: ["dev"]

jobs:
  build-push:
    runs-on: ubuntu-latest-arm64

    steps:
      - name: pull code
        uses: actions/checkout@4

      - name: docker install
        uses: docker/setup-buildx-action@v3

      - name: login docker
        uses: docker/login-actions@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: docker build
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }} .
          docker push -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }}

